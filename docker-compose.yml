# =============================================================================
# lyqtRpc — 本地开发编排
# -----------------------------------------------------------------------------
# 启动（无需手动初始化子模块，Dockerfile 会自动处理缺失的 muduo）：
#   docker compose up -d
#   docker compose logs -f          # 查看日志
#   docker compose down -v          # 停止并清理数据卷
# =============================================================================

services:
  etcd:
    image: bitnamilegacy/etcd:3.5
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health --dial-timeout=2s --command-timeout=5s || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 15s
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data

  registry:
    build:
      context: .
      network: host
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    command: /opt/rpc/bin/test1_registry_server
    environment:
      LCZ_ETCD: http://etcd:2379
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
    ports:
      - "8080:8080"

  provider:
    build:
      context: .
      network: host
    restart: unless-stopped
    depends_on:
      - registry
    command: /opt/rpc/bin/test1_rpc_server
    environment:
      LCZ_ETCD: http://etcd:2379
      LCZ_REGISTRY_HOST: registry
      LCZ_REGISTRY_PORT: "8080"
      LCZ_PROVIDER_HOST: 127.0.0.1
      LCZ_PROVIDER_PORT: "8889"
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
    ports:
      - "8889:8889"

  # Proto 后端：benchmark_server 同时提供 add / echo 两个 Proto 方法。
  # 网关必须指向它而不是 provider —— 网关走 call_proto（Proto 路径），
  # 而 test1_rpc_server 只用 registerMethod 注册了 JSON 服务；服务端 JSON
  # 与 Proto 是两套独立注册表（rpc_server.hpp 的 _rpc_router 与
  # _proto_rpc_router），proto 路由查不到即回 SERVICE_NOT_FOUND，
  # 网关会把它转成 HTTP 502。实测过：指向 provider 时 /api/add、/api/echo
  # 都是 502，指向本服务则双双 200。
  # host 侧 8889 已被 provider 占用，故对外发布为 8890。
  bench:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: /opt/rpc/bin/benchmark_server 8889 0 8080 0 9090
    environment:
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
    ports:
      - "8890:8889"

  # HTTP→RPC 网关，直连 bench（gateway_server 内部 discover=false，不走注册中心）。
  # 注意 host 侧端口重映射: 容器内仍是默认的 HTTP 8080 / metrics 9091，
  # 但 host 的 8080 已被 registry 占用，故网关对外发布为 8081。
  # 路由: POST /api/add、POST /api/echo（字段见 rpc_envelope.proto，
  # 分别是 num1/num2 与 data）、GET /api/health、GET /diagnose。
  gateway:
    build:
      context: .
      network: host
    restart: unless-stopped
    depends_on:
      - bench
    command: /opt/rpc/bin/gateway_server bench 8889 8080 9091
    environment:
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
    ports:
      - "8081:8080"
      - "9091:9091"

volumes:
  etcd-data:
